<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-primary text-white p-3">
        <div class="container">
            <h2 class="text-center mb-0">MINI SHOP</h2>
        </div>
    </header>

    <nav class="bg-light border-bottom">
        <div class="container py-3">
            <a href="#" class="me-3 text-decoration-none text-dark">Trang chủ</a>
            <a href="#sanpham" class="text-decoration-none text-dark">Sản phẩm</a>
        </div>
    </nav>

    <section class="container mt-4">
        <div class="bg-light p-5 text-center rounded shadow-sm">
            <h1 class="display-6 fw-bold">Chào mừng đến Mini Shop</h1>
            <p class="lead mb-3">Mua sắm dễ dàng - Giá tốt mỗi ngày</p>
            <a href="#sanpham" class="btn btn-primary">Xem sản phẩm</a>
        </div>
    </section>

    <section id="sanpham" class="container mt-4">
        <h2 class="text-center mb-4">Sản phẩm nổi bật</h2>
        <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    <img src="../images/aothunnam.webp" class="card-img-top rounded-top" alt="Áo thun nam" style="height: 220px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">Áo thun nam</h5>
                        <p class="text-danger fw-bold mb-3">199.000đ</p>
                        <a href="#" class="btn btn-success">Mua ngay</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    <img src="../images/aosominu.webp" class="card-img-top rounded-top" alt="Áo sơ mi nữ" style="height: 220px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">Áo sơ mi nữ</h5>
                        <p class="text-danger fw-bold mb-3">299.000đ</p>
                        <a href="#" class="btn btn-success">Mua ngay</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    <img src="../images/quanjeans.jpg" class="card-img-top rounded-top" alt="Quần jeans" style="height: 220px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">Quần jeans</h5>
                        <p class="text-danger fw-bold mb-3">399.000đ</p>
                        <a href="#" class="btn btn-success">Mua ngay</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0 rounded-4">
                    <img src="../images/banner.webp" class="card-img-top rounded-top" alt="Váy thơm" style="height: 220px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">Váy thời trang</h5>
                        <p class="text-danger fw-bold mb-3">450.000đ</p>
                        <a href="#" class="btn btn-success">Mua ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 Mini Shop - Thiết kế bằng Bootstrap 5</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
